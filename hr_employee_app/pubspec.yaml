name: hr_employee_app
description: Enterprise HR mobile application for employees and staff.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # State management + dependency injection
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.7.0

  # Immutability / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3

  # Diagnostics
  logger: ^2.4.0

  # Platform capabilities required by the attendance / leave / payslip modules
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.2

  # Formatting
  intl: ^0.20.0
  material_ui: ^1.11.1
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
