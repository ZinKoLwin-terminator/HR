<h2 mat-dialog-title>{{ data.title }}</h2>

<form class="entity-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-dialog-content>
    @if (formError()) {
      <div class="form-banner" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        <span>{{ formError() }}</span>
      </div>
    }

    <div class="form-grid">
      @for (field of data.fields; track field.key) {
        <app-form-field
          [class.span-all]="field.fullWidth || field.type === 'textarea'"
          [field]="field"
          [control]="control(field)"
          [options]="optionsFor(field)"
        />
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="18" aria-hidden="true" />
        <span>Saving…</span>
      } @else {
        {{ data.submitLabel }}
      }
    </button>
  </mat-dialog-actions>
</form>
