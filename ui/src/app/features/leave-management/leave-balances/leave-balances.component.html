<app-page-header
  title="Leave balances"
  description="Available days (available / entitled) for each employee. Entitlements follow the leave policies."
>
  <ng-container pageSearch>
    <app-search-field
      label="Search by employee name or code"
      [value]="search()"
      (searchChange)="setSearch($event)"
    />
    <app-filter-popup [activeCount]="filterCount()" (cleared)="clearFilters()">
      <app-filter-field label="Year">
        <mat-form-field subscriptSizing="dynamic">
          <mat-select
            placeholder="All"
            aria-label="Year"
            [value]="year()"
            (selectionChange)="setFilter('year', $event.value)"
          >
            @for (y of yearOptions; track y) {
              <mat-option [value]="y">{{ y }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </app-filter-field>
      <app-filter-field label="Department">
        <mat-form-field subscriptSizing="dynamic">
          <mat-select
            placeholder="All"
            aria-label="Department"
            [value]="departmentId()"
            (selectionChange)="setFilter('department', $event.value)"
          >
            <mat-option [value]="null">All</mat-option>
            @for (option of departmentOptions(); track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </app-filter-field>
      <app-filter-field label="Branch">
        <mat-form-field subscriptSizing="dynamic">
          <mat-select
            placeholder="All"
            aria-label="Branch"
            [value]="branchId()"
            (selectionChange)="setFilter('branch', $event.value)"
          >
            <mat-option [value]="null">All</mat-option>
            @for (option of branchOptions(); track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </app-filter-field>
    </app-filter-popup>
  </ng-container>
</app-page-header>

@if (page.error() && !result()) {
  <app-empty-state icon="error" title="Balances could not be loaded" [message]="errorText()">
    <button mat-flat-button type="button" (click)="page.reload()">Try again</button>
  </app-empty-state>
} @else {
  <app-data-table
    caption="Leave balances"
    [columns]="columns()"
    [rows]="result()?.items ?? []"
    [total]="result()?.total ?? 0"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    [sort]="sort()"
    [loading]="page.isLoading()"
    [actions]="actions"
    [rowLabel]="rowLabel"
    [clickableRows]="true"
    emptyTitle="No employees found"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (action)="onAction($event)"
    (rowClick)="openDetails($event)"
  />
}
