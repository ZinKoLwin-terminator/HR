@if (resource.error()) {
  <app-empty-state
    icon="receipt_long"
    title="Payslip not found"
    message="It may have been removed when its period was returned to draft."
  >
    <a mat-flat-button routerLink="/payroll/payslips">Back to payslips</a>
  </app-empty-state>
} @else if (payslip(); as p) {
  <div class="actions no-print">
    <button mat-stroked-button type="button" (click)="back()">
      <mat-icon>arrow_back</mat-icon>Back
    </button>
    <button
      mat-flat-button
      type="button"
      [attr.aria-label]="'Print payslip for ' + p.employeeName"
      (click)="print()"
    >
      <mat-icon>print</mat-icon>Print payslip
    </button>
  </div>

  <app-payslip-sheet [payslip]="p" />
} @else {
  <mat-progress-bar mode="indeterminate" aria-label="Loading payslip" />
}
