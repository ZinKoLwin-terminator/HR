name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Angular app lives in ui/ and the .NET API in api/.
defaults:
  run:
    working-directory: ui

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  # Builds and tests the API. Nothing is deployed. Runs on every push and pull request (not only
  # when api/** changes) so the deploy job's `needs` is always satisfied.
  # The SQL Server integration tests (Category=Integration) are excluded: they need LocalDB and the
  # dacpac from the separate database repository. To run them in CI later: add a
  # mcr.microsoft.com/mssql/server service container, publish the dacpac as an artifact from the DB
  # repo, and point tests/Apex.Hrms.IntegrationTests/Support/SqlServerEnvironment.cs at them
  # (it currently targets LocalDB only, on Windows). Never point it at a real database.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Apex.Hrms.slnx
      - run: dotnet build Apex.Hrms.slnx --configuration Release --no-restore -warnaserror
      - run: >-
          dotnet test Apex.Hrms.slnx --configuration Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=results.trx" --results-directory ${{ runner.temp }}/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, e2e, api]
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # GitHub Pages serves the site from /<repository>/, so the base href must match.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA fallback: serve index.html for unknown paths so deep links work.
      - run: cp dist/hrms/browser/index.html dist/hrms/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist/hrms/browser
      - id: deployment
        uses: actions/deploy-pages@v4
